; =============================================================================
;  Waveshare ESP32-S3-Touch-AMOLED-1.75 (1.75" CO5300 466x466 round AMOLED)
;  https://www.waveshare.com/esp32-s3-touch-amoled-1.75.htm
;  Community / EXPERIMENTAL - not hardware-tested in-house, not in the web
;  flasher. Pin map from Waveshare's BSP (esp32_s3_touch_amoled_1_75.h/.c).
;
;  Core: ESP32-S3R8, 16MB flash / 8MB octal PSRAM (qio_opi).
;
;  Display: CO5300 AMOLED over QSPI, native LovyanGFX Panel_CO5300 subclassed
;  to 466x466 in src/lgfx_boards.h (LGFX_AMOLED175). Column gap 6.
;    QSPI : SCK=38 D0..D3=4/5/6/7   CS=12  RST=39
;  Everything renders into a 466x466 PSRAM sprite pushed once per tick
;  (PANEL_CO5300_FRAME_SPRITE). Brightness is DCS 0x51 - no backlight pin.
;
;  Shared I2C (SDA=15 SCL=14): CST9217 touch @0x5A (INT=11 RST=40), AXP2101
;  PMU @0x34, ES8311 @0x18, ES7210 mics, QMI8658 IMU, PCF85063 RTC.
;  Audio: ES8311 + I2S (MCLK=42 BCLK=9 LRCK=45 DOUT=8) + PA enable 46.
;  microSD: CMD=1 CLK=2 D0=3. Header free pins: 16/17/18 (+ UART 43/44).
;
;  Layout: DISPLAY_ROUND_466 - the round dashboard scaled to 466.
; =============================================================================
[env:ws_amoled_175]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_16mb.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_deps =
    ${common.lib_deps}
    lewisxhe/XPowersLib@0.3.3
build_flags =
    -D BOARD_VARIANT=\"ws_amoled_175\"
    -D BOARD_NAME=\"Waveshare_ESP32-S3-Touch-AMOLED-1.75\"
    -D BOARD_PANEL=\"CO5300_466x466_round_AMOLED\"
    -D BOARD_IS_AMOLED175=1
    -D BOARD_HAS_PSRAM=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; --- Layout profile (round 466x466) ---
    -D DISPLAY_ROUND_466=1
    ; --- AMOLED brightness is a DCS register, not a backlight pin ---
    -D BACKLIGHT_PIN=-1
    ; --- Touch: Hynitron CST9217 on the shared I2C bus ---
    -D USE_CST92XX=1
    -D CST92XX_SDA=15
    -D CST92XX_SCL=14
    -D CST92XX_INT=11
    -D CST92XX_RST=40
    -D CST92XX_ADDR=0x5A
    ; --- Battery gauge via the AXP2101 PMU ---
    -D BOARD_HAS_BATTERY=1
    -D BOARD_HAS_BAT_AXP2101=1
    -D AXP2101_I2C_SDA=15
    -D AXP2101_I2C_SCL=14
    -D AXP2101_SLAVE_ADDRESS=0x34
    ; --- Speaker: ES8311 codec + I2S + PA ---
    -D BOARD_HAS_ES8311_AUDIO=1
    -D AUDIO_I2C_ADDR=0x18
    -D AUDIO_I2C_SDA=15
    -D AUDIO_I2C_SCL=14
    -D AUDIO_I2S_PORT=0
    -D AUDIO_I2S_MCLK=42
    -D AUDIO_I2S_BCLK=9
    -D AUDIO_I2S_LRC=45
    -D AUDIO_I2S_DOUT=8
    -D AUDIO_PA_CTRL=46
    ; ENABLE_OTA_AUTO is deliberately absent: the updater only accepts a
    ; release asset for this board, and it is not in tools/release.py yet.
    ; Manual /ota/upload still works. Add at promotion.
