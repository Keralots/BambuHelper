; =============================================================================
;  Waveshare ESP32-S3-Touch-LCD-2.8C (2.8" ST7701 480x480 round IPS + GT911)
;  https://www.waveshare.com/esp32-s3-touch-lcd-2.8c.htm
;  Community / untested - issue #171. Pin map from the vendor Arduino demo
;  (Display_ST7701.h, Touch_GT911.h, TCA9554PWR.h, BAT_Driver.h).
;
;  Core: ESP32-S3R8, 16MB flash / 8MB octal PSRAM. STANDALONE env - it must
;  NOT extend s3_common, whose USE_ST7789_INVERT would make
;  applyPanelInversion() send an unconditional invertDisplay(true); this
;  ST7701 vendor list never sends 0x21 and runs inversion OFF.
;
;  Display: ST7701 480x480 over the LCD_CAM RGB bus (16-bit) + a 3-wire SPI
;  command interface. LCD reset / LCD CS / touch reset / buzzer all hang off a
;  TCA9554 IO expander @0x20 - see initDisplay() and io_expander_tca9554.cpp.
;
;    RGB ctrl  : HSYNC=38 VSYNC=39 DE=40 PCLK=41
;    RGB data  : D0..D15 = 5,45,48,47,21,14,13,12,11,10,9,46,3,8,18,17
;    SPI init  : SCLK=2 MOSI=1 (CS via expander bit2)
;    Backlight : GPIO6      I2C: SDA=15 SCL=7
;    Expander  : bit0 LCD RST, bit1 TP RST, bit2 LCD CS, bit3 SD CS, bit7 buzzer
;
;  Layout: DISPLAY_ROUND_480 - the round dashboard at 2x the GC9A01 profile.
; =============================================================================
[env:ws_lcd_28c]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_16mb.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_deps = ${common.lib_deps}
build_flags =
    -D BOARD_VARIANT=\"ws_lcd_28c\"
    -D BOARD_NAME=\"Waveshare_ESP32-S3-Touch-LCD-2.8C\"
    -D BOARD_PANEL=\"ST7701_480x480_round\"
    -D BOARD_IS_WS28C=1
    -D BOARD_HAS_PSRAM=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; --- Layout profile (round 480x480) ---
    -D DISPLAY_ROUND_480=1
    -D BACKLIGHT_PIN=6
    ; --- RGB pixel clock ---
    ; The vendor runs 30 MHz with a 10-line bounce buffer. LovyanGFX's Bus_RGB
    ; has no bounce buffer, so a PSRAM framebuffer tears/drifts at that rate.
    ; Start conservative; raise until the image breaks.
    -D WS28C_PCLK_HZ=12000000
    ; First suspects on a rolling / shifted / black image, in order:
    ;   1. WS28C_PCLK_HZ too high
    ;   2. the four polarity bits in LGFX_WS28C (de_idle_high, pclk_idle_high,
    ;      hsync_polarity, vsync_polarity) - copied from the SenseCAP ST7701S,
    ;      not derived for this panel
    ;   3. offset_rotation (0 here; the SenseCAP panel needs 2)
    ; --- Touch (GT911 on the shared I2C bus) ---
    -D GT911_SDA=15
    -D GT911_SCL=7
    -D GT911_INT=16
    ; ENABLE_OTA_AUTO is deliberately absent: the updater only accepts a
    ; BambuHelper-ws_lcd_28c-*-ota.bin release asset, and this board is not in
    ; tools/release.py yet. Manual /ota/upload still works. Add at promotion.
