; Freenove FNK0104S
; ESP32-S3 N16R8: 16MB QIO flash + 8MB OPI PSRAM
; 4.0" ST7796 SPI display (320x480 native; landscape via rotation)
; FT6336 capacitive touch

[env:freenove_fnk0104s]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_build.partitions = partitions_16mb.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.f_flash = 80000000L
board_build.flash_mode = qio

lib_deps = ${common.lib_deps}

build_flags =
    -D BOARD_VARIANT=\"freenove_fnk0104s\"
    -D BOARD_NAME=\"Freenove_FNK0104S\"
    -D BOARD_PANEL=\"ST7796_320x480\"
    -D BOARD_IS_BRO_FREENOVE=1
    -D BOARD_HAS_PSRAM=1
    -D DISPLAY_320x480=1
    -D BACKLIGHT_PIN=45
    -D USE_FT6336=1
    -D FT6336_SDA=16
    -D FT6336_SCL=15
    -D FT6336_RST=18
    -D ENABLE_OTA_AUTO=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ${no_exceptions.build_flags}

build_unflags = ${no_exceptions.build_unflags}
