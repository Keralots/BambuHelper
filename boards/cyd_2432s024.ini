; =============================================================================
;  CYD 2.4" / ESP32-2432S024 (ILI9341 + XPT2046 on the LCD bus, issue #186)
;  The 2.4" sibling of the classic ESP32-2432S028 "Cheap Yellow Display" -
;  same ESP32, same ILI9341 240x320 panel, same display SPI pins, but wired
;  differently in two ways that break the `cyd` build:
;    - backlight on GPIO27 instead of GPIO21 (`cyd` -> black screen);
;    - the XPT2046 touch shares the LCD SPI bus (sclk 14 / mosi 13 /
;      miso 12, CS 33) instead of the S028's separate 25/32/39 pins
;      (`cyd` -> touch never responds).
;  `tzt_2432` has the right backlight pin but an ST7789 init sequence, so it
;  gives a lit white screen on this ILI9341 panel.
;
;  The panel's native state is INVOFF (the S028 V2 panel needs INVON), so the
;  "Invert display colors" checkbox is off by default on this board too.
;
;  Community board, hardware-confirmed by the requester in #186 (display,
;  colours, touch). Everything else is inherited from the cyd env, including
;  the runtime ILI9341 V2 / Classic panel toggle.
; =============================================================================
[env:cyd_2432s024]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 230400
board_build.partitions = min_spiffs.csv
lib_deps =
    ${common.lib_deps}
build_flags =
    -D BOARD_IS_CYD_2432S024=1
    ; --- Touch: XPT2046 on the LCD SPI bus ---
    ; Driven by LovyanGFX's Touch_XPT2046 (see LGFX_CYD_Impl), so no USE_XPT2046
    ; and no XPT2046_Touchscreen lib - its SPIClass would fight the panel bus.
    ; T_IRQ is not used: 21 was measured going low on touch, the S024 spec says
    ; 36; polling the chip works either way.
    -D TOUCH_CS=33
    ; --- Layout profile ---
    -D DISPLAY_CYD=1
    -D DISPLAY_240x320=1
    -D BOARD_VARIANT=\"cyd_2432s024\"
    -D BOARD_NAME=\"ESP32-2432S024_CYD\"
    -D BOARD_PANEL=\"ILI9341_240x320_resistive\"
    -D ENABLE_OTA_AUTO=1
    -D BOARD_LOW_RAM=1
    -D BACKLIGHT_PIN=27
