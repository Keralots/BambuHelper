; =============================================================================
;  LCDwiki "4.0inch ESP32-32E Display", SKU E32R40T (ST7796S 320x480 + XPT2046)
;  https://www.lcdwiki.com/4.0inch_ESP32-32E_Display   (issue #175)
;  Community / UNVERIFIED - no owner board. #175 reporter tests builds.
;
;  Same lcdwiki ESP32-32E family as the 2.8" DISPLAY_CYD clone, but a bigger
;  ST7796S 320x480 panel instead of ILI9341 240x320. Classic ESP32-WROOM-32E,
;  4 MB flash, no PSRAM -> 1 printer (BOARD_LOW_RAM), like CYD.
;
;  Touch (XPT2046) shares the LCD's SCK/MOSI/MISO, so it CANNOT use the
;  separate-HSPI USE_XPT2046 backend (that re-muxes the pins and kills the
;  panel). Instead the touch hangs off the same Bus_SPI with bus_shared=true
;  inside the LGFX_E32R40T class; only TOUCH_CS is set here. Reads go through
;  the getTouch() fallback (button_touch_none.cpp) - code-unverified, first env
;  to use it.
; =============================================================================
[env:e32r40t]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 230400
board_build.partitions = min_spiffs.csv
lib_deps = ${common.lib_deps}
build_flags =
    ; --- Board identity ---
    -D BOARD_IS_E32R40T=1
    -D BOARD_VARIANT=\"e32r40t\"
    -D BOARD_NAME=\"LCDwiki_ESP32-32E_4.0\"
    -D BOARD_PANEL=\"ST7796_320x480_resistive\"
    -D ENABLE_OTA_AUTO=1
    -D BOARD_LOW_RAM=1
    ; --- Layout profile (same 320x480 as ws_lcd_350 / jc3248w535) ---
    -D DISPLAY_320x480=1
    -D BACKLIGHT_PIN=27
    ; --- Touch: LovyanGFX shared-bus XPT2046. Only TOUCH_CS here; the SPI pins
    ;     + shared-bus flag live in the LGFX class. Do NOT set USE_XPT2046 (that
    ;     picks the separate-HSPI backend, which would steal the LCD's SPI pins). ---
    -D TOUCH_CS=33
