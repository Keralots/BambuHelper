; =============================================================================
;  LCDwiki ES3C35P (3.5" ESP32-S3, ST77922 320x480 QSPI + built-in cap touch)
;  https://www.lcdwiki.com/3.5inch_ESP32-S3_Display
;  Sold under several names, e.g. Hosyond "ESP32-S3 Touchscreen Module 3.5"" and
;  the AliExpress "cheap black display" listings.
;
;  Core: ESP32-S3 N16R8 (16 MB flash, PSRAM) - standalone env, like ws_lcd_350.
;
;  Display: ST77922 over quad-SPI with NO DC pin. Register writes go out on one
;  data line and pixel data on four, which neither LovyanGFX's SPI bus nor
;  Arduino_GFX's Arduino_ESP32QSPI can produce, so src/lgfx_panel_st77922_qspi.hpp
;  drives the SPI device itself. Pins (CS=10 SCLK=12 D0=11 D1=13 D2=14 D3=9) are
;  fixed in that class. No reset pin (tied to the chip's own reset).
;  Like jc3248w535 it draws into a full-frame PSRAM sprite pushed once per tick
;  (PANEL_REQUIRES_AXS_FRAME_SPRITE); the panel itself stays at rotation 0.
;
;  Touch: built into the ST77922 itself (I2C 0x55, 16-bit register addresses),
;  NOT FT6x36-compatible -> src/button_touch_st77922.cpp. RST (GPIO48) idles low
;  and must be pulsed before the touch half answers.
;
;  Battery: GPIO 8 through a 1:2 divider (ADC 2.007 V x 2 = 4.01 V against a
;  multimeter reading of 3.99-4.00 V).
;
;  Hardware-tested pin map and driver come from the Launcher port of this board
;  (bmorcelli/Launcher PR 475). Audio (ES8311 + amp) is not driven here.
; =============================================================================
[env:es3c35p]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_16mb.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
board_build.flash_mode = qio
lib_deps = ${common.lib_deps}
build_flags =
    -D BOARD_VARIANT=\"es3c35p\"
    -D BOARD_NAME=\"LCDwiki_ES3C35P\"
    -D BOARD_PANEL=\"ST77922_320x480_QSPI\"
    -D BOARD_IS_ES3C35P=1
    -D ENABLE_OTA_AUTO=1
    -D BOARD_HAS_PSRAM=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; --- Layout profile (same 320x480 as jc3248w535 / ws_lcd_350) ---
    -D DISPLAY_320x480=1
    -D BACKLIGHT_PIN=41
    ; --- Battery sense: GPIO 8, 1:2 divider ---
    -D BOARD_HAS_BATTERY=1
    -D BOARD_HAS_BAT_ADC=1
    -D BAT_ADC_PIN=8
    -D BAT_VOLT_DIVIDER=2.0f
    ; --- Touch (ST77922 integrated controller, I2C @0x55) ---
    -D USE_ST77922_TOUCH=1
    -D ST77922_TOUCH_SDA=38
    -D ST77922_TOUCH_SCL=39
    -D ST77922_TOUCH_INT=47
    -D ST77922_TOUCH_RST=48
