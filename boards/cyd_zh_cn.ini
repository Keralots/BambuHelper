; English + Simplified Chinese firmware for the classic ESP32-2432S028 CYD.
[env:cyd_zh_cn]
extends = env:cyd
extra_scripts =
    ${env.extra_scripts}
    post:tools/enable_lto.py
build_flags =
    ${env:cyd.build_flags}
    -D BAMBUHELPER_ZH_CN=1
    -flto
    ${no_exceptions.build_flags}
build_unflags = ${no_exceptions.build_unflags}
