; =============================================================================
;  CYD clone with ILI9341 + backlight on GPIO27 (issue #186)
;  Aliexpress/Temu "cheap yellow display" clone. Identical to the standard
;  ESP32-2432S028 CYD (same ESP32, same display SPI, same XPT2046 resistive
;  touch, same ILI9341 panel) EXCEPT for two pins: the LCD backlight is driven
;  from GPIO27 instead of GPIO21 - the same backlight pin the ST7789-based TZT
;  L1435-2.4 clone uses - and the touch interrupt sits on the now-free GPIO21
;  instead of GPIO36.
;
;  That single pin is why neither existing build works on this hardware:
;    - `cyd`       : correct ILI9341 driver, but drives GPIO21 -> the panel is
;                    initialised and drawn, the backlight never turns on, so
;                    the screen stays black.
;    - `tzt_2432`  : correct backlight pin, but sends an ST7789 init sequence
;                    to an ILI9341 controller -> lit but uninitialised panel,
;                    i.e. a bright white screen.
;
;  The display half is confirmed working on the reporter's board (with the
;  "Invert display colors" toggle on); the touch pins below still need a
;  hardware check. Everything else is inherited from the cyd env unchanged,
;  including the two runtime toggles on the Display settings page: the ILI9341
;  panel variant (V2 / Classic) and the ESP32-32E clone pin map.
;
;  Community / hardware-UNVERIFIED - I do not own this board. Not part of the
;  release set (tools/release.py), so the portal's auto-update check finds no
;  asset for this variant and hides the Install button; OTA by manual file
;  upload works normally. Promote it to the release set once a user confirms
;  the display works.
; =============================================================================
[env:cyd_bl27]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 230400
board_build.partitions = min_spiffs.csv
lib_deps =
    ${common.lib_deps}
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
    ; --- CYD touch (XPT2046 on separate SPI bus) ---
    -D USE_XPT2046=1
    -D TOUCH_CS=33
    ; T_IRQ is on GPIO21 here, not GPIO36 as on the stock CYD - GPIO21 is free
    ; on this clone because the backlight moved to GPIO27 (reported in #186:
    ; the pin goes low while the panel is touched). The XPT2046 library gates
    ; every getPoint() on a FALLING edge from this pin, so a wrong IRQ pin
    ; means touch never reports anything at all.
    -D TOUCH_IRQ=21
    -D TOUCH_MOSI=32
    -D TOUCH_MISO=39
    -D TOUCH_CLK=25
    -D SPI_TOUCH_FREQUENCY=2500000
    ; --- Layout profile ---
    -D DISPLAY_CYD=1
    -D DISPLAY_240x320=1
    -D BOARD_VARIANT=\"cyd_bl27\"
    -D BOARD_NAME=\"ESP32-2432S028_CYD_BL27\"
    -D BOARD_PANEL=\"ILI9341_240x320_resistive\"
    -D ENABLE_OTA_AUTO=1
    -D BOARD_LOW_RAM=1
    ; The only difference from [env:cyd]: backlight on GPIO27, not GPIO21.
    -D BACKLIGHT_PIN=27
