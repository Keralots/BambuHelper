; =============================================================================
;  CYD clone with ILI9341 + backlight on GPIO27 (issue #186)
;  Aliexpress/Temu "cheap yellow display" clone. Identical to the standard
;  ESP32-2432S028 CYD (same ESP32, same display SPI, same XPT2046 resistive
;  touch, same ILI9341 panel) EXCEPT for two things: the LCD backlight is
;  driven from GPIO27 instead of GPIO21 - the same backlight pin the
;  ST7789-based TZT L1435-2.4 clone uses - and the XPT2046 shares the LCD SPI
;  bus (ESP32-2432S024 layout) instead of having its own pins.
;
;  That single pin is why neither existing build works on this hardware:
;    - `cyd`       : correct ILI9341 driver, but drives GPIO21 -> the panel is
;                    initialised and drawn, the backlight never turns on, so
;                    the screen stays black.
;    - `tzt_2432`  : correct backlight pin, but sends an ST7789 init sequence
;                    to an ILI9341 controller -> lit but uninitialised panel,
;                    i.e. a bright white screen.
;
;  The display half is confirmed working on the reporter's board (with the
;  "Invert display colors" toggle on); the shared-bus touch below still needs
;  a hardware check (the separate-pins build left touch dead). Everything else is inherited from the cyd env unchanged,
;  including the two runtime toggles on the Display settings page: the ILI9341
;  panel variant (V2 / Classic) and the ESP32-32E clone pin map.
;
;  Community / hardware-UNVERIFIED - I do not own this board. Not part of the
;  release set (tools/release.py), so the portal's auto-update check finds no
;  asset for this variant and hides the Install button; OTA by manual file
;  upload works normally. Promote it to the release set once a user confirms
;  the display works.
; =============================================================================
[env:cyd_bl27]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 230400
board_build.partitions = min_spiffs.csv
lib_deps =
    ${common.lib_deps}
build_flags =
    -D BOARD_IS_CYD_BL27=1
    ; --- Touch: XPT2046 on the LCD SPI bus (sclk 14 / mosi 13 / miso 12) ---
    ; Unlike the stock CYD (own soft-SPI on 25/32/39), this clone follows the
    ; ESP32-2432S024 layout and hangs the touch chip on the display bus - the
    ; PrintpooP preset the reporter ran has `bus_shared = true` and pins -1.
    ; Driven by LovyanGFX's Touch_XPT2046 (see LGFX_CYD_Impl), so no USE_XPT2046
    ; and no XPT2046_Touchscreen lib - its SPIClass would fight the panel bus.
    ; T_IRQ is not used: 21 was measured going low on touch, the S024 spec says
    ; 36; polling the chip works either way.
    -D TOUCH_CS=33
    ; --- Layout profile ---
    -D DISPLAY_CYD=1
    -D DISPLAY_240x320=1
    -D BOARD_VARIANT=\"cyd_bl27\"
    -D BOARD_NAME=\"ESP32-2432S028_CYD_BL27\"
    -D BOARD_PANEL=\"ILI9341_240x320_resistive\"
    -D ENABLE_OTA_AUTO=1
    -D BOARD_LOW_RAM=1
    ; Backlight on GPIO27, not GPIO21.
    -D BACKLIGHT_PIN=27
