; =============================================================================
;  Guition JC4827W543 (4.3" NV3041A 480x272 QSPI IPS, ESP32-S3-WROOM-1 N4R8)
;  Community port. Same QSPI pin map as the JC3248W535 (CS=45 SCK=47
;  D0=21 D1=48 D2=40 D3=39, backlight GPIO1), different panel controller
;  (NV3041A, native landscape 480x272) and GT911 capacitive touch on I2C.
;
;  Flash: the stock board ships with a 4 MB module (N4R8). Some batches carry
;  an N16R8 module - build `jc4827w543_16mb` instead if esptool reports 16MB.
;  4 MB means: no on-device HMS text table, no camera preview (like esp32s3).
; =============================================================================
[jc4827w543_common]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
lib_deps =
    ${common.lib_deps}
    moononournation/GFX Library for Arduino@~1.5.0
build_flags =
    -D BOARD_NAME=\"Guition_JC4827W543\"
    -D BOARD_PANEL=\"NV3041A_480x272_QSPI\"
    -D BOARD_IS_JC4827W543=1
    -D ENABLE_OTA_AUTO=1
    -D BOARD_HAS_PSRAM=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; --- Display (NV3041A QSPI, 480x272 landscape native) ---
    ; Pins are hard-coded inside Panel_NV3041A_AGFX (src/lgfx_panel_nv3041a_agfx.hpp)
    -D DISPLAY_480x272=1
    -D BACKLIGHT_PIN=1
    ; --- Touch (GT911 capacitive on I2C, addr 0x5D / 0x14) ---
    -D USE_GT911=1
    -D GT911_SDA=8
    -D GT911_SCL=4
    -D GT911_INT=3
    -D GT911_RST=38
    ; NS4168 I2S speaker is on the board but its pin map is not verified yet -
    ; left disabled until measured. Buzzer GPIO defaults to disabled in the UI.

[env:jc4827w543]
extends = jc4827w543_common
board_build.partitions = partitions_4mb.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags =
    ${jc4827w543_common.build_flags}
    -D BOARD_VARIANT=\"jc4827w543\"

[env:jc4827w543_16mb]
extends = jc4827w543_common
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    ${jc4827w543_common.build_flags}
    -D BOARD_VARIANT=\"jc4827w543_16mb\"
    -D BOARD_FLASH_16MB=1
